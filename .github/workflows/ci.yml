name: Python Test Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on"
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          HEADLESS: "true"
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          mkdir -p reports
          pytest -v \
            --browser=${{ inputs.browser || 'chrome' }} \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

      - name: Upload HTML and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.browser || 'chrome' }}
          path: reports/
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ inputs.browser || 'chrome' }}
          path: "**/screenshots/*.png"
          if-no-files-found: ignore