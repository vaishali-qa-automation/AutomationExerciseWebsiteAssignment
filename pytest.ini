[pytest]
browser=chrome
headless = true
addopts =
    --html=reports/report.html
    --self-contained-html
# ReportPortal Integration Settings
rp_endpoint = http://localhost:8080
rp_api_key = latest-key_xm2cBg80ST24xmplTnI-83Ny0459UDlTzQdbzMPkfzjItEKt3xtDJNNjaisNV3pH
rp_project = automation_exercise_practice
rp_launch = Selenium_Automation_Run
rp_launch_attributes = 'UI' 'API' 'Selenium' 'Windows'
rp_launch_description = Executing Selenium Python UI and API Tests

# Send log records as they happen
rp_log_batch_size = 1

# for console logging
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)s] %(name)s::%(funcName)s::%(lineno)d::%(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    smoke: Quick critical-path tests
    ui: Tests that require a browser
    api: API-only tests
    ui_api: tests combining both API and UI layers in a single workflow
